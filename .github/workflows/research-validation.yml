name: Research validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Tests and recorded-result checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the reviewed tree
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-10-21
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, verified 2026-10-21
        with:
          python-version: '3.12'
      - name: Install pinned dependencies for historical LSA tests
        run: python -m pip install -r requirements-phase6.txt
      - name: Run all correctness tests
        run: python -m unittest discover -s tests -v
      - name: Validate committed Phase 17 results and paired opportunities
        run: python scripts/validate_phase17.py --directory results
      - name: Validate committed Phase 18 feasibility certificates
        run: python scripts/validate_phase18.py --directory results
      - name: Validate committed Phase 19 source-independent certificates
        run: python scripts/validate_phase19.py --directory results
      - name: Validate exploratory Phase 19 matched-edit certificates
        run: python scripts/validate_phase19.py --directory results --prefix phase19b

  publish-phase17:
    name: Publish approved Phase 17 checkpoint
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish-phase17]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the approved merge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-10-21
        with:
          persist-credentials: false
      - name: Verify approved report, result and protocol hashes
        run: sha256sum --check configs/phase17_release_sha256.txt
      - name: Create the checkpoint and attach approved artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          phase17_tag=phase17-fixed-anchor-evidence
          if phase17_target=$(gh release view "$phase17_tag" --json targetCommitish --jq .targetCommitish 2>/dev/null); then
            if [ "$phase17_target" != "$GITHUB_SHA" ]; then
              echo 'An existing Phase 17 release points to a different commit; refusing to change it.' >&2
              exit 1
            fi
          else
            gh release create "$phase17_tag" \
              --target "$GITHUB_SHA" \
              --title 'Phase 17: controlled boundary-guided evidence retrieval' \
              --notes-file docs/phase17_release_notes.md \
              --draft
          fi
          gh release upload "$phase17_tag" \
            deliverables/phase17_research_report_fa.pdf \
            deliverables/phase17_research_report_fa.docx \
            results/phase17_rows.json.gz \
            configs/phase17_release_sha256.txt \
            --clobber
          gh release edit "$phase17_tag" --draft=false --latest
          gh release view "$phase17_tag" --json url,tagName,isDraft,targetCommitish,assets

  publish-phase18:
    name: Publish approved Phase 18 checkpoint
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish-phase18]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the approved merge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified in Phase 17
        with:
          persist-credentials: false
      - name: Verify approved Phase 18 artifacts
        run: sha256sum --check configs/phase18_release_sha256.txt
      - name: Publish the approved checkpoint and artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          phase18_tag=phase18-exact-evidence-feasibility
          if phase18_target=$(gh release view "$phase18_tag" --json targetCommitish --jq .targetCommitish 2>/dev/null); then
            if [ "$phase18_target" != "$GITHUB_SHA" ]; then
              echo 'An existing Phase 18 release points to a different commit; refusing to change it.' >&2
              exit 1
            fi
          else
            gh release create "$phase18_tag" \
              --target "$GITHUB_SHA" \
              --title 'Phase 18: exact evidence feasibility and minimum budget' \
              --notes-file docs/phase18_release_notes.md \
              --draft
          fi
          gh release upload "$phase18_tag" \
            deliverables/phase18_research_report_fa.pdf \
            deliverables/phase18_research_report_fa.docx \
            results/phase18_queries.json.gz \
            results/phase18_rows.json.gz \
            configs/phase18_release_sha256.txt \
            --clobber
          gh release edit "$phase18_tag" --draft=false --latest
          gh release view "$phase18_tag" --json url,tagName,isDraft,targetCommitish,assets

  publish-phase19:
    name: Publish approved Phase 19 checkpoint
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish-phase19]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the approved Phase 19 merge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified in Phase17
        with:
          persist-credentials: false
      - name: Verify reviewed Phase 19 artifacts
        run: sha256sum --check configs/phase19_release_sha256.txt
      - name: Publish the approved checkpoint and artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          phase19_tag=phase19-session-access-audit
          if phase19_target=$(gh release view "$phase19_tag" --json targetCommitish --jq .targetCommitish 2>/dev/null); then
            if [ "$phase19_target" != "$GITHUB_SHA" ]; then
              echo 'An existing Phase 19 release points to a different commit; refusing to change it.' >&2
              exit 1
            fi
          else
            gh release create "$phase19_tag" \
              --target "$GITHUB_SHA" \
              --title 'Phase 19: session access and exact matched-edit audit' \
              --notes-file docs/phase19_release_notes.md \
              --draft
          fi
          gh release upload "$phase19_tag" \
            deliverables/phase19_research_report_fa.pdf \
            deliverables/phase19_research_report_fa.docx \
            results/phase19_queries.json.gz \
            results/phase19_rows.json.gz \
            results/phase19b_queries.json.gz \
            results/phase19b_rows.json.gz \
            configs/phase19_release_sha256.txt \
            --clobber
          gh release edit "$phase19_tag" --draft=false --latest
          gh release view "$phase19_tag" --json url,tagName,isDraft,targetCommitish,assets
